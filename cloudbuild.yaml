# ============================================================================
# cloudbuild.yaml — ZEA Web Enterprise (zea.cl B2B Corporate Landing)
# ============================================================================
# Cloud Build → GCP Artifact Registry (southamerica-west1) → Cloud Run
# ============================================================================

steps:
  # Step 1: Docker Build
  - name: 'gcr.io/cloud-builders/docker'
    id: docker-build
    args:
      - 'build'
      - '--platform=linux/amd64'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/zea/zea-web:latest'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/zea/zea-web:commit-${_COMMIT_SHA}'
      - '.'

  # Step 2: Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: docker-push
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/zea/zea-web:commit-${_COMMIT_SHA}'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy-cloud-run
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'zea-web'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/zea/zea-web:commit-${_COMMIT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=3000'
      - '--cpu=1'
      - '--memory=512Mi'
      - '--min-instances=0'
      - '--max-instances=10'

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/zea/zea-web:latest'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/zea/zea-web:commit-${_COMMIT_SHA}'

substitutions:
  _REGION: southamerica-west1
  _COMMIT_SHA: 'none'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
